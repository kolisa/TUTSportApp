name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build (fail on warnings)
        run: dotnet build --no-restore --warnaserror
      - name: Run unit tests
        run: dotnet test TUTSportApp.UnitTest/TUTSportApp.UnitTest.csproj --no-build --collect:"XPlat Code Coverage"
      - name: Run integration tests
        run: dotnet test TUTSportApp.IntegrationTest/TUTSportApp.IntegrationTest.csproj --no-build
